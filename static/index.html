<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>个人信息速递</title>
<link rel="stylesheet" href="/style.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f0f4f8;color:#2c3e50;min-height:100vh;padding:1rem;
    display:flex;justify-content:center;align-items:flex-start;
  }
  .container{max-width:420px;width:100%;padding-top:1rem}
  .header{text-align:center;margin-bottom:1.25rem}
  .header h1{font-size:1.35rem;font-weight:700;color:#1a1a2e}
  .header .sub{font-size:.78rem;color:#999;margin-top:.25rem}
  .card{
    background:#fff;border-radius:14px;padding:1.25rem 1.1rem;
    box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:.85rem
  }
  .card-title{font-size:.95rem;font-weight:600;color:#1a1a2e;margin-bottom:.85rem;display:flex;align-items:center;gap:.35rem}
  .card-title .icon{font-size:1.1rem}
  .field{margin-bottom:.65rem;position:relative}
  .field-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem}
  .field-header label{font-size:.8rem;color:#777}
  .field-label-input{
    font-size:.8rem;color:#2c3e50;border:1px dashed #d0d0d0;border-radius:4px;
    padding:.2rem .4rem;width:60%;outline:none;font-family:inherit;background:#fafafa
  }
  .field-label-input:focus{border-color:#4a90d9;background:#fff}
  .btn-delete{
    background:none;border:none;color:#ccc;font-size:1rem;cursor:pointer;
    padding:.15rem .35rem;border-radius:4px;line-height:1;transition:color .15s
  }
  .btn-delete:hover{color:#e74c3c}
  .field input,.field textarea{
    width:100%;padding:.55rem .65rem;border:1px solid #e0e0e0;border-radius:8px;
    font-size:.9rem;color:#2c3e50;outline:none;transition:border-color .2s;
    font-family:inherit;resize:vertical
  }
  .field input:focus,.field textarea:focus{border-color:#4a90d9}
  .field textarea{min-height:3.5rem}
  .btn{
    display:block;width:100%;padding:.6rem;border:none;border-radius:8px;
    font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;
    font-family:inherit
  }
  .btn:active{transform:scale(.98)}
  .btn-save{background:#f0f4f8;color:#4a90d9;margin-top:.5rem}
  .btn-share{background:#1a1a2e;color:#fff;margin-top:.85rem}
  .btn-add{
    background:none;border:1.5px dashed #d0d0d0;color:#999;margin-top:.3rem;
    padding:.5rem;border-radius:8px;font-size:.85rem;font-weight:500
  }
  .btn-add:hover{border-color:#4a90d9;color:#4a90d9}
  .btn-copy{
    background:#f0f4f8;color:#4a90d9;margin-top:.5rem;font-size:.85rem
  }
  .btn:disabled{opacity:.5;pointer-events:none}
  .checkbox-group{display:flex;flex-wrap:wrap;gap:.5rem .9rem;margin-bottom:.25rem}
  .checkbox-group label{
    display:flex;align-items:center;gap:.25rem;font-size:.83rem;color:#444;cursor:pointer;
    background:#f8f9fb;padding:.25rem .55rem;border-radius:6px
  }
  .checkbox-group input[type=checkbox]{width:.95rem;height:.95rem;accent-color:#1a1a2e}
  .checkbox-group label:has(input:checked){background:#e8edf5}
  .checkbox-sep{border-top:1px solid #eee;margin:.5rem 0 .3rem}
  .qr-section{text-align:center}
  .qr-section img{max-width:200px;width:100%;border-radius:8px;margin:.6rem 0}
  .qr-section .hint{font-size:.75rem;color:#999;margin-top:.4rem}
  .toast{
    position:fixed;top:1rem;left:50%;transform:translateX(-50%);
    background:#1a1a2e;color:#fff;padding:.5rem 1.2rem;border-radius:20px;
    font-size:.8rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none
  }
  .toast.show{opacity:1}
  .footer{text-align:center;margin-top:1.5rem;font-size:.7rem;color:#ccc}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="container">
  <div class="header">
    <h1>个人信息速递</h1>
    <div class="sub">安全 · 快捷 · 阅后即焚</div>
  </div>

  <!-- 信息表单 -->
  <div class="card">
    <div class="card-title"><span class="icon">📝</span>我的信息</div>
    <div id="fieldsContainer"></div>
    <button class="btn btn-save" onclick="collectAndSave()">💾 保存到本地</button>
  </div>

  <!-- 分享设置 -->
  <div class="card">
    <div class="card-title"><span class="icon">📤</span>生成分享二维码</div>
    <div class="checkbox-group" id="checkboxGroup"></div>
    <div class="checkbox-sep"></div>
    <div class="checkbox-group">
      <label><input type="checkbox" id="chkOneTime" checked> 🔒 一次性分享（仅限一人查看，30秒内可重试）</label>
    </div>
    <button class="btn btn-share" id="btnShare" onclick="generateQR()">🔗 生成二维码</button>
    <div class="qr-section" id="qrSection" style="display:none">
      <div id="qrLoading" style="display:none;color:#888;font-size:.85rem;margin:.5rem 0">⏳ 加载二维码中...</div>
      <img id="qrImage" alt="二维码" style="display:none">
      <div id="qrError" style="display:none;color:#e74c3c;font-size:.85rem;margin:.5rem 0"></div>
      <a id="qrLink" target="_blank" rel="noopener" style="display:none;font-size:.8rem;color:#4a90d9;word-break:break-all"></a>
      <button class="btn btn-copy" id="btnCopy" style="display:none" onclick="copyShareLink()">📋 复制分享链接</button>
      <div class="hint">⏱ 二维码有效期5分钟 · 开启"一次性分享"后仅限一人查看，加载失败30秒内可重试</div>
    </div>
  </div>

  <div class="footer">个人信息速递 V1.0 · 数据仅保存在您的设备中</div>
</div>

<script>
// ============================================================
//  配置：API_BASE 自动适配当前域名
// ============================================================
const API_BASE = window.location.origin;

const STORAGE_KEY = 'quick_send_profile_v2';
const DEVICE_ID_KEY = 'quick_send_device_id';

let currentShareUrl = '';

// ---- 默认字段 ----
const DEFAULT_FIELDS = [
  { id: 'phone',       label: '手机号',   value: '', deletable: false, type: 'tel' },
  { id: 'address',     label: '收货地址', value: '', deletable: true,  type: 'textarea' },
  { id: 'note',        label: '公司/备注', value: '', deletable: true,  type: 'text' },
];

let fields = [];

// ---- 工具函数 ----
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getDeviceId() {
  let id = localStorage.getItem(DEVICE_ID_KEY);
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem(DEVICE_ID_KEY, id);
  }
  return id;
}
const DEVICE_ID = getDeviceId();

let toastTimer;
function showToast(msg, duration = 2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// ---- localStorage ----
function loadFields() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.fields && Array.isArray(data.fields) && data.fields.length > 0) {
        // 合并默认字段（保留可能新增的默认字段）
        const saved = data.fields;
        const merged = [];
        for (const df of DEFAULT_FIELDS) {
          const existing = saved.find(f => f.id === df.id);
          merged.push(existing || { ...df });
        }
        // 添加自定义字段
        for (const f of saved) {
          if (!DEFAULT_FIELDS.find(df => df.id === f.id)) {
            merged.push(f);
          }
        }
        return merged;
      }
    }
  } catch (e) { /* corrupted */ }
  return DEFAULT_FIELDS.map(f => ({ ...f }));
}

function persistFields() {
  collectValues(); // 先收集当前输入
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ fields }));
}

// ---- 从 DOM 收集值到 fields 数组 ----
function collectValues() {
  for (const f of fields) {
    const el = document.getElementById('field_' + f.id);
    if (el) f.value = el.value;
    if (f.deletable) {
      const labelEl = document.getElementById('label_' + f.id);
      if (labelEl) f.label = labelEl.value.trim() || f.label;
    }
  }
}

// ---- 渲染字段列表 ----
function renderFields() {
  const container = document.getElementById('fieldsContainer');
  container.innerHTML = '';

  for (const field of fields) {
    const div = document.createElement('div');
    div.className = 'field';

    // header: label + delete button
    const header = document.createElement('div');
    header.className = 'field-header';

    if (field.deletable) {
      header.innerHTML = `<input type="text" class="field-label-input" id="label_${field.id}" value="${escapeHtml(field.label)}" placeholder="字段名">`;
    } else {
      header.innerHTML = `<label>${escapeHtml(field.label)} <span style="color:#bbb;font-size:.7rem">(必填)</span></label>`;
    }

    if (field.deletable) {
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete';
      delBtn.textContent = '✕';
      delBtn.title = '删除此字段';
      delBtn.onclick = () => deleteField(field.id);
      header.appendChild(delBtn);
    }

    div.appendChild(header);

    // input
    const val = field.value || '';
    if (field.type === 'textarea') {
      const ta = document.createElement('textarea');
      ta.id = 'field_' + field.id;
      ta.placeholder = field.label;
      ta.rows = 2;
      ta.value = val;
      div.appendChild(ta);
    } else {
      const inp = document.createElement('input');
      inp.type = field.type;
      inp.id = 'field_' + field.id;
      inp.placeholder = field.label;
      inp.value = val;
      if (field.type === 'tel') inp.maxLength = 20;
      else inp.maxLength = 50;
      div.appendChild(inp);
    }

    container.appendChild(div);
  }

  // + 添加字段按钮
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-add';
  addBtn.textContent = '+ 添加字段';
  addBtn.onclick = addField;
  container.appendChild(addBtn);

  // 同步渲染勾选框
  renderCheckboxes();
}

// ---- 渲染分享勾选框 ----
function renderCheckboxes() {
  const container = document.getElementById('checkboxGroup');
  container.innerHTML = '';

  for (const field of fields) {
    const label = document.createElement('label');
    const checked = field.id === 'phone' ? ' checked' : (field.value ? ' checked' : '');
    label.innerHTML = `<input type="checkbox" class="field-check" data-field-id="${field.id}"${checked}> ${escapeHtml(field.label || '(未命名)')}`;
    container.appendChild(label);
  }
}

// ---- 添加字段 ----
function addField() {
  const label = (prompt('请输入新字段名称（如：邮箱、微信号）：') || '').trim();
  if (!label) return;

  fields.push({
    id: 'custom_' + Date.now(),
    label: label,
    value: '',
    deletable: true,
    type: 'text',
  });

  renderFields();
  persistFields();
  showToast('✅ 字段已添加');
}

// ---- 删除字段 ----
function deleteField(id) {
  const field = fields.find(f => f.id === id);
  if (!field) return;
  if (!confirm(`确定删除"${field.label}"字段及其内容吗？`)) return;

  fields = fields.filter(f => f.id !== id);
  renderFields();
  persistFields();
  showToast('🗑 字段已删除');
}

// ---- 收集并保存 ----
function collectAndSave() {
  collectValues();
  persistFields();
  renderCheckboxes();
  showToast('✅ 信息已保存到本地');
}

// ---- 生成二维码 ----
async function generateQR() {
  collectValues();
  persistFields();

  // 收集勾选的字段
  const shareData = {};
  const checks = document.querySelectorAll('.field-check:checked');
  for (const cb of checks) {
    const fid = cb.dataset.fieldId;
    const field = fields.find(f => f.id === fid);
    if (!field) continue;
    const el = document.getElementById('field_' + fid);
    const value = el ? el.value.trim() : field.value;
    if (value) {
      // 用字段的标签作为 key
      if (field.deletable) {
        const labelEl = document.getElementById('label_' + fid);
        if (labelEl) field.label = labelEl.value.trim() || field.label;
      }
      shareData[field.label] = value;
    }
  }

  if (Object.keys(shareData).length === 0) {
    showToast('⚠️ 请至少选择一个有内容的字段');
    return;
  }

  const btn = document.getElementById('btnShare');
  btn.disabled = true;
  btn.textContent = '⏳ 生成中...';

  try {
    const resp = await fetch(`${API_BASE}/create_share`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
      body: JSON.stringify({
        data: shareData,
        expire_minutes: 5,
        one_time: document.getElementById('chkOneTime').checked,
      }),
    });
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(errText || `HTTP ${resp.status}`);
    }
    const { token } = await resp.json();

    currentShareUrl = `${API_BASE}/s/${token}`;
    const qrUrl = `${API_BASE}/qrcode/${token}`;

    const qrSection = document.getElementById('qrSection');
    const qrImg = document.getElementById('qrImage');
    const qrLoading = document.getElementById('qrLoading');
    const qrError = document.getElementById('qrError');
    const qrLink = document.getElementById('qrLink');
    const btnCopy = document.getElementById('btnCopy');

    qrSection.style.display = 'block';
    qrImg.style.display = 'none';
    qrLoading.style.display = 'block';
    qrError.style.display = 'none';
    qrLink.style.display = 'none';
    btnCopy.style.display = 'none';
    qrImg.removeAttribute('src');

    qrImg.onload = function() {
      qrLoading.style.display = 'none';
      qrImg.style.display = 'inline';
      btnCopy.style.display = 'block';
    };

    qrImg.onerror = function() {
      qrLoading.style.display = 'none';
      qrError.style.display = 'block';
      qrError.textContent = '⚠️ 二维码图片加载失败，请点击下方链接手动打开分享页：';
      qrLink.style.display = 'block';
      qrLink.href = currentShareUrl;
      qrLink.textContent = currentShareUrl;
      btnCopy.style.display = 'block';
    };

    qrImg.src = qrUrl;
    qrImg.alt = '分享二维码';
    showToast('✅ 二维码已生成');
  } catch (err) {
    showToast(`❌ 生成失败：${err.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔗 生成二维码';
  }
}

// ---- 复制分享链接 ----
async function copyShareLink() {
  if (!currentShareUrl) return;
  try {
    await navigator.clipboard.writeText(currentShareUrl);
    showToast('📋 链接已复制，可粘贴发送给好友');
  } catch (e) {
    // 降级：选中文本框让用户手动复制
    const input = document.createElement('input');
    input.value = currentShareUrl;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    showToast('📋 链接已复制');
  }
}

// ---- 初始化 ----
(function init() {
  fields = loadFields();
  renderFields();

  // 从 URL 参数自动填充手机号（可用于外部调起）
  const params = new URLSearchParams(window.location.search);
  const phoneParam = params.get('phone');
  if (phoneParam) {
    const phoneField = fields.find(f => f.id === 'phone');
    if (phoneField) phoneField.value = phoneParam;
    renderFields();
  }
})();
</script>

</body>
</html>
